version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Minor/patch PRs merge themselves once CI passes (dependabot-auto-merge.yml). Waiting 5 days
    # after a release skips versions that get pulled for being broken or compromised. Security
    # updates are not delayed.
    cooldown:
      default-days: 5
    # One PR for all minor/patch bumps; majors still get their own PR.
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # typescript-eslint (via eslint-config-next) supports typescript <6.1.0; widen once it does.
      - dependency-name: "typescript"
        versions: [">=6.1"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      actions:
        patterns: ["*"]
